<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1a1508">
<title>Ruang Tunggu 0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1a1508;
    --panel: rgba(32, 26, 10, .74);
    --edge: #b9993f;
    --ink: #f3e6b0;
    --accent: #e9c95c;
    --accent-ink: #241c06;
    --accent-edge: #8a6f1e;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); }
  body {
    font-family: 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
    color: var(--ink);
    -webkit-user-select: none; user-select: none;
  }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  /* kabut tipis + grain di atas kanvas */
  .haze {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 42%, transparent 38%, rgba(24, 16, 2, .6) 100%);
  }
  .grain { position: fixed; inset: 0; pointer-events: none; opacity: .5; mix-blend-mode: overlay; }

  /* papan nama pemain */
  .plaque {
    position: fixed;
    top: max(14px, calc(env(safe-area-inset-top, 0px) + 8px));
    left: max(14px, calc(env(safe-area-inset-left, 0px) + 8px));
    padding: 8px 16px 9px 14px;
    background: var(--panel);
    border-left: 3px solid var(--accent);
    line-height: 1.1;
  }
  .plaque b { display: block; font-size: 24px; font-weight: 600; letter-spacing: .02em; }
  .plaque span { font-size: 15px; opacity: .72; }

  /* menu: bawah di potret, kolom kanan di lanskap */
  .menu {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 0 16px max(18px, calc(env(safe-area-inset-bottom, 0px) + 12px));
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    pointer-events: none;
  }
  .menu > * { pointer-events: auto; }
  @media (orientation: landscape) {
    .menu {
      left: auto; top: 50%; bottom: auto; transform: translateY(-50%);
      width: 300px;
      padding: 0 max(22px, calc(env(safe-area-inset-right, 0px) + 12px)) 0 0;
      box-sizing: content-box;
    }
  }
  button {
    font: inherit; color: inherit; cursor: pointer;
    -webkit-appearance: none; appearance: none;
  }
  button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  .play {
    width: min(360px, 100%); height: 60px;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    background: var(--accent); color: var(--accent-ink);
    border: 2px solid var(--accent-edge); border-bottom-width: 6px; border-radius: 3px;
    font-size: 30px; font-weight: 600; letter-spacing: .03em;
    transition: transform .08s ease, border-bottom-width .08s ease;
  }
  .play:active { transform: translateY(3px); border-bottom-width: 3px; }
  .row { display: flex; gap: 8px; width: min(360px, 100%); }
  .sec {
    flex: 1; height: 46px;
    display: flex; align-items: center; justify-content: center; gap: 7px;
    background: var(--panel); border: 1px solid var(--edge); border-radius: 3px;
    font-size: 19px; font-weight: 500;
  }
  .sec:active { background: rgba(70, 56, 18, .85); }
  svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .play svg.i { width: 24px; height: 24px; fill: currentColor; stroke: none; }

  .toast {
    position: fixed; left: 50%; top: 18%;
    transform: translate(-50%, -8px);
    max-width: min(86vw, 420px); padding: 10px 16px;
    background: var(--panel); border: 1px solid var(--edge);
    font-size: 18px; text-align: center;
    opacity: 0; pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
  }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }

  /* layar muat */
  .loader {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: var(--bg); padding: 24px; text-align: center;
    transition: opacity .6s ease;
  }
  .loader.done { opacity: 0; pointer-events: none; }
  .loader p { margin: 0; font-size: 22px; }
  .bar { width: min(240px, 70vw); height: 3px; background: rgba(243, 230, 176, .18); }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); }
  .loader.err p { max-width: 34ch; line-height: 1.3; }
  .loader.err .bar { display: none; }

  @media (prefers-reduced-motion: reduce) {
    .loader, .toast, .play { transition: none; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="haze"></div>
<div class="grain"></div>

<div class="plaque"><b>Pemain baru</b><span>Ruang tunggu 0</span></div>

<nav class="menu" aria-label="Menu lobby">
  <button class="play" data-act="start">
    <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"/></svg>
    Mulai
  </button>
  <div class="row">
    <button class="sec" data-act="char">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3l-5 3 2 4 3-1v11h8V9l3 1 2-4-5-3a4 4 0 0 1-8 0z"/></svg>
      Karakter
    </button>
    <button class="sec" data-act="friends">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.8a3.5 3.5 0 0 1 0 6.4M18 14a6.5 6.5 0 0 1 3.5 6"/></svg>
      Teman
    </button>
    <button class="sec" data-act="settings">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"/></svg>
      Atur
    </button>
  </div>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="loader" id="loader">
  <p id="loaderText">Memuat karakter 0%</p>
  <div class="bar"><i id="barFill"></i></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ============ PENGATURAN (ubah di sini kalau tampilan kurang pas) ============ */
const CONFIG = {
  modelUrl: './human.glb',
  modelBytes: 17844072,     // dipakai untuk persen muat bila server tidak kirim ukuran
  characterHeight: 1.7,     // tinggi karakter di dunia game (meter)
  fogColor: 0xcfb878,
  fogDensity: 0.075,        // makin besar makin berkabut
  exposure: 1.15,
  bloomStrength: 0.45,       // 0 untuk mematikan bloom
  bloomRadius: 0.9,
  bloomThreshold: 0.95,
  keyLight: 80,            // lampu utama di atas karakter
  fillLight: 26,            // lampu pengisi dari depan
  hemiLight: 1.2,           // cahaya ambient
  maxPixelRatio: 1.75
};
/* ============================================================================ */

const $ = s => document.querySelector(s);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const motion = reduceMotion ? 0.35 : 1;

/* grain film */
(() => {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'), im = g.createImageData(128, 128);
  for (let i = 0; i < im.data.length; i += 4) {
    im.data[i] = im.data[i + 1] = im.data[i + 2] = Math.random() * 255;
    im.data[i + 3] = 22;
  }
  g.putImageData(im, 0, 0);
  $('.grain').style.backgroundImage = `url(${c.toDataURL()})`;
})();

/* toast + tombol menu */
const toastEl = $('#toast'); let toastTimer;
function toast(msg) {
  toastEl.textContent = msg; toastEl.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('on'), 2600);
}
document.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => {
  const act = b.dataset.act;
  window.dispatchEvent(new CustomEvent('lobby:' + act));   // sambungkan fitur nanti lewat event ini
  toast(act === 'start' ? 'Peta belum dibuat. Tombol ini disiapkan untuk langkah berikutnya.'
                        : 'Fitur ini belum tersedia.');
}));

/* ---------- renderer ---------- */
const canvas = $('#c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, CONFIG.maxPixelRatio));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = CONFIG.exposure;

const scene = new THREE.Scene();
scene.background = new THREE.Color(CONFIG.fogColor);
scene.fog = new THREE.FogExp2(CONFIG.fogColor, CONFIG.fogDensity);

const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 40);

const size = renderer.getSize(new THREE.Vector2());
const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(size.x, size.y, {
  type: THREE.HalfFloatType, samples: 4
}));
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(size.x / 2, size.y / 2),
  CONFIG.bloomStrength, CONFIG.bloomRadius, CONFIG.bloomThreshold);
bloom.enabled = CONFIG.bloomStrength > 0;
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ---------- tekstur prosedural ---------- */
function canvasTex(sz, draw) {
  const c = document.createElement('canvas'); c.width = c.height = sz;
  draw(c.getContext('2d'), sz);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = Math.min(4, renderer.capabilities.getMaxAnisotropy());
  return t;
}
const rnd = Math.random;
const wallBase = canvasTex(256, (g, s) => {
  g.fillStyle = '#b9a45a'; g.fillRect(0, 0, s, s);
  for (let x = 0; x < s; x += 32) {
    g.fillStyle = (x / 32) % 2 ? 'rgba(255,240,170,.10)' : 'rgba(70,50,10,.10)';
    g.fillRect(x, 0, 16, s);
    g.fillStyle = 'rgba(90,70,20,.25)'; g.fillRect(x + 8, 0, 1, s);
  }
  for (let i = 0; i < 2600; i++) {
    g.fillStyle = `rgba(${rnd() < .5 ? '60,45,10' : '255,235,160'},${rnd() * .08})`;
    g.fillRect(rnd() * s, rnd() * s, 1 + rnd() * 2, 1 + rnd() * 2);
  }
});
const carpetBase = canvasTex(256, (g, s) => {
  g.fillStyle = '#8f7d3a'; g.fillRect(0, 0, s, s);
  for (let i = 0; i < 9000; i++) {
    g.fillStyle = `rgba(${rnd() > .5 ? '200,180,90' : '50,40,10'},${rnd() * .25})`;
    g.fillRect(rnd() * s, rnd() * s, 2, 2);
  }
});
const ceilBase = canvasTex(128, (g, s) => {
  g.fillStyle = '#cbb978'; g.fillRect(0, 0, s, s);
  g.fillStyle = 'rgba(80,62,20,.5)'; g.fillRect(0, 0, s, 2); g.fillRect(0, 0, 2, s);
  for (let i = 0; i < 600; i++) { g.fillStyle = `rgba(60,45,10,${rnd() * .07})`; g.fillRect(rnd() * s, rnd() * s, 2, 2); }
});
function mat(base, rx, ry, rough = 0.95) {
  const t = base.clone(); t.needsUpdate = true; t.repeat.set(rx, ry);
  return new THREE.MeshStandardMaterial({ map: t, roughness: rough, metalness: 0 });
}

/* ---------- ruang tunggu (liminal) ---------- */
const W = 8, D = 12, H = 3.2, ZB = -7, ZF = 5;   // lebar, dalam, tinggi, dinding belakang, dinding depan
function plane(w, h, material, pos, rot) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), material);
  m.position.set(...pos); m.rotation.set(...rot); m.receiveShadow = true; scene.add(m); return m;
}
plane(W, D, mat(carpetBase, 8, 12, 1), [0, 0, (ZB + ZF) / 2], [-Math.PI / 2, 0, 0]);
plane(W, D, mat(ceilBase, 4, 6), [0, H, (ZB + ZF) / 2], [Math.PI / 2, 0, 0]);
plane(W, H, mat(wallBase, 4, 1.35), [0, H / 2, ZB], [0, 0, 0]);
plane(W, H, mat(wallBase, 4, 1.35), [0, H / 2, ZF], [0, Math.PI, 0]);
plane(D, H, mat(wallBase, 6, 1.35), [-W / 2, H / 2, (ZB + ZF) / 2], [0, Math.PI / 2, 0]);
plane(D, H, mat(wallBase, 6, 1.35), [W / 2, H / 2, (ZB + ZF) / 2], [0, -Math.PI / 2, 0]);

// lis bawah dinding
const trimMat = new THREE.MeshStandardMaterial({ color: 0x4a3c16, roughness: 0.8 });
[[W, 0.01, 0.12, 0, 0.12, ZB + 0.06], [0.12, 0.01, D, -W / 2 + 0.06, 0.12, (ZB + ZF) / 2], [0.12, 0.01, D, W / 2 - 0.06, 0.12, (ZB + ZF) / 2]]
  .forEach(([x, , z, px, py, pz]) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(x, 0.24, z), trimMat); m.position.set(px, py, pz); scene.add(m);
  });

// pintu gelap di dinding belakang
const frame = new THREE.Mesh(new THREE.PlaneGeometry(1.4, 2.25), new THREE.MeshBasicMaterial({ color: 0x5d4d22 }));
frame.position.set(2.2, 1.125, ZB + 0.015); scene.add(frame);
const door = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 2.1), new THREE.MeshBasicMaterial({ color: 0x0f0b03 }));
door.position.set(2.2, 1.05, ZB + 0.02); scene.add(door);

// tiang
const pillar = new THREE.Mesh(new THREE.BoxGeometry(0.7, H, 0.7), mat(wallBase, 1, 1.35));
pillar.position.set(-2.6, H / 2, -3); pillar.castShadow = pillar.receiveShadow = true; scene.add(pillar);

// panel lampu neon langit-langit
const panelGeo = new THREE.PlaneGeometry(1.3, 0.55);
const panelMain = new THREE.MeshBasicMaterial({ color: 0xffffff, toneMapped: false });
const panelDim = [];
const tint = new THREE.Color(0xfff0b8);
function addPanel(x, z, material) {
  const m = new THREE.Mesh(panelGeo, material); m.rotation.x = Math.PI / 2; m.position.set(x, H - 0.01, z); scene.add(m);
}
addPanel(0, 0.4, panelMain);
[[-2.2, -2.5], [2.2, -2.5], [0, -5], [-2.2, 2.6], [2.2, 2.6], [-2.2, -5.2], [2.2, -5.2]].forEach(([x, z]) => {
  const m = new THREE.MeshBasicMaterial({ color: tint.clone().multiplyScalar(0.9 + rnd() * 0.9), toneMapped: false });
  panelDim.push(m); addPanel(x, z, m);
});

/* ---------- cahaya ---------- */
scene.add(new THREE.HemisphereLight(0xfff0b0, 0x6b5a2a, CONFIG.hemiLight));
const key = new THREE.SpotLight(0xffe6a8, CONFIG.keyLight, 12, 0.85, 0.9, 2);
key.position.set(0, H - 0.15, 0.5);
key.target.position.set(0, 0.9, 0);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.bias = -0.0005; key.shadow.normalBias = 0.02; key.shadow.radius = 4;
scene.add(key, key.target);
const fill = new THREE.PointLight(0xfff1c8, CONFIG.fillLight, 9, 2);
fill.position.set(0.9, 1.7, 2.8); scene.add(fill);
const deep = new THREE.PointLight(0xffe9a0, 14, 10, 2);
deep.position.set(0, 2.6, -3.5); scene.add(deep);

/* ---------- debu melayang ---------- */
const DUST = 170;
const dustPos = new Float32Array(DUST * 3), dustSeed = new Float32Array(DUST);
for (let i = 0; i < DUST; i++) {
  dustPos[i * 3] = (rnd() - .5) * 6; dustPos[i * 3 + 1] = rnd() * 3; dustPos[i * 3 + 2] = -5 + rnd() * 8.5;
  dustSeed[i] = rnd() * 100;
}
const dustGeo = new THREE.BufferGeometry();
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
const dotTex = canvasTex(32, (g, s) => {
  const r = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = r; g.fillRect(0, 0, s, s);
});
dotTex.wrapS = dotTex.wrapT = THREE.ClampToEdgeWrapping;
const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({
  map: dotTex, color: 0xfff0b0, size: 0.05, transparent: true, opacity: 0.55, depthWrite: false, fog: false
}));
scene.add(dust);

/* ---------- karakter ---------- */
const holder = new THREE.Group();   // diputar saat digeser
const fixer = new THREE.Group();    // koreksi arah hadap, skala, dan posisi kaki
holder.add(fixer); scene.add(holder);

const bones = {};
const clean = n => n.replace(/^mixamorig:?/, '').replace(/_\d+$/, '');
const wp = o => o.getWorldPosition(new THREE.Vector3());
const rig = [];                     // tulang yang dianimasikan
let ready = false;

// arahkan tulang ke arah dunia tertentu (tidak tergantung sumbu lokal tulang)
function aimBone(bone, child, dir) {
  bone.updateWorldMatrix(true, true);
  const cur = wp(child).sub(wp(bone)).normalize();
  const delta = new THREE.Quaternion().setFromUnitVectors(cur, dir.clone().normalize());
  const pQ = bone.parent.getWorldQuaternion(new THREE.Quaternion());
  const bQ = bone.getWorldQuaternion(new THREE.Quaternion());
  bone.quaternion.copy(pQ.invert().multiply(delta.multiply(bQ)));
  bone.updateMatrixWorld(true);
}

function setupCharacter(gltf) {
  const model = gltf.scene;
  fixer.add(model);
  model.traverse(o => {
    if (o.isBone) bones[clean(o.name)] = o;
    if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; o.frustumCulled = false; }
  });
  model.updateMatrixWorld(true);

  // 1) arah hadap: putar supaya menghadap kamera (+Z)
  if (bones.LeftFoot && bones.LeftToeBase) {
    const d = wp(bones.LeftToeBase).sub(wp(bones.LeftFoot)); d.y = 0;
    if (d.lengthSq() > 1e-10) fixer.rotation.y = -Math.atan2(d.x, d.z);
  }
  fixer.updateMatrixWorld(true);

  // 2) turunkan lengan dari T-pose
  const hipsX = bones.Hips ? wp(bones.Hips).x : 0;
  for (const side of ['Left', 'Right']) {
    const arm = bones[side + 'Arm'], fore = bones[side + 'ForeArm'], hand = bones[side + 'Hand'];
    if (!arm || !fore || !hand) continue;
    const sgn = Math.sign(wp(arm).x - hipsX) || 1;
    aimBone(arm, fore, new THREE.Vector3(sgn * 0.17, -1, 0.04));
    aimBone(fore, hand, new THREE.Vector3(sgn * 0.05, -1, 0.24));
  }

  // 3) skala + letakkan kaki di lantai, tengah di x/z = 0
  let box = new THREE.Box3().setFromObject(model, true);
  fixer.scale.setScalar(CONFIG.characterHeight / (box.max.y - box.min.y));
  fixer.updateMatrixWorld(true);
  box = new THREE.Box3().setFromObject(model, true);
  fixer.position.set(-(box.min.x + box.max.x) / 2, -box.min.y, -(box.min.z + box.max.z) / 2);
  fixer.updateMatrixWorld(true);

  // 4) simpan pose awal untuk animasi idle
  ['Hips', 'Spine', 'Spine1', 'Spine2', 'Neck', 'Head', 'LeftShoulder', 'RightShoulder',
   'LeftArm', 'RightArm', 'LeftForeArm', 'RightForeArm'].forEach(k => {
    const b = bones[k]; if (!b) return;
    const pQ = b.parent.getWorldQuaternion(new THREE.Quaternion());
    rig.push({ k, bone: b, q0: b.quaternion.clone(), pQ, pInv: pQ.clone().invert() });
  });
  ready = true;
}

const _e = new THREE.Euler(), _q = new THREE.Quaternion();
const R = {};   // akses cepat
function rot(k, x = 0, y = 0, z = 0) {
  const r = R[k]; if (!r) return;
  _q.setFromEuler(_e.set(x * motion, y * motion, z * motion));
  r.bone.quaternion.copy(r.pInv).multiply(_q).multiply(r.pQ).multiply(r.q0);
}

// animasi idle: napas, kepala, tumpuan badan, ayunan lengan (rotasi dalam sumbu dunia)
function idle(t) {
  const br = Math.sin(t * 1.55);
  rot('Hips', 0, 0.025 * Math.sin(t * 0.45), 0.014 * Math.sin(t * 0.45 + 0.6));
  rot('Spine', -0.008 * br, -0.015 * Math.sin(t * 0.45), -0.008 * Math.sin(t * 0.45 + 0.6));
  rot('Spine1', -0.016 * br, 0, 0);
  rot('Spine2', -0.02 * br, 0, 0);
  rot('LeftShoulder', 0, 0, 0.018 * br);
  rot('RightShoulder', 0, 0, -0.018 * br);
  const look = Math.sin(t * 0.33) * 0.14 + Math.sin(t * 0.91) * 0.03;
  rot('Neck', 0.012 * Math.sin(t * 0.5 + 1), look * 0.45, 0);
  rot('Head', 0.03 * Math.sin(t * 0.5 + 1) + 0.01 * br, look * 0.55, 0.012 * Math.sin(t * 0.33));
  rot('LeftArm', 0.018 * Math.sin(t * 0.8), 0, 0.022 * Math.sin(t * 0.8 + 0.4) + 0.01 * br);
  rot('RightArm', 0.018 * Math.sin(t * 0.8 + 0.9), 0, -0.022 * Math.sin(t * 0.8 + 1.3) - 0.01 * br);
  rot('LeftForeArm', 0.025 * Math.sin(t * 0.8 + 0.8), 0, 0);
  rot('RightForeArm', 0.025 * Math.sin(t * 0.8 + 1.7), 0, 0);
}

/* ---------- muat model ---------- */
const loaderEl = $('#loader'), loaderText = $('#loaderText'), barFill = $('#barFill');
function showError(msg) {
  loaderEl.classList.add('err'); loaderText.textContent = msg;
}
new GLTFLoader().load(
  CONFIG.modelUrl,
  gltf => {
    try { setupCharacter(gltf); rig.forEach(r => R[r.k] = r); }
    catch (e) { console.error(e); showError('Model berhasil dimuat tetapi gagal disiapkan. Lihat konsol browser untuk detailnya.'); return; }
    loaderEl.classList.add('done');
    setTimeout(() => loaderEl.remove(), 800);
  },
  xhr => {
    const total = xhr.lengthComputable && xhr.total ? xhr.total : CONFIG.modelBytes;
    const p = Math.min(1, xhr.loaded / total);
    loaderText.textContent = 'Memuat karakter ' + Math.round(p * 100) + '%';
    barFill.style.width = (p * 100) + '%';
  },
  err => {
    console.error(err);
    showError(location.protocol === 'file:'
      ? 'Buka halaman ini lewat server (misalnya Vercel atau live server), bukan dengan mengeklik file langsung.'
      : 'Model tidak bisa dimuat. Pastikan human.glb ada di folder yang sama dengan index.html.');
  }
);

/* ---------- kamera + input ---------- */
let camBase = new THREE.Vector3(0, 1.2, 3.3), lookY = 0.95;
function resize() {
  const w = innerWidth, h = innerHeight, a = w / h;
  renderer.setSize(w, h, false);
  composer.setSize(w, h);
  camera.aspect = a;
  const portrait = a < 0.85;
  camBase.set(0, portrait ? 1.15 : 1.2, portrait ? 3.3 + (0.85 - a) * 2.2 : 3.3);
  lookY = portrait ? 0.62 : 0.95;
  camera.clearViewOffset();
  if (a > 1.2) camera.setViewOffset(w, h, w * 0.1, 0, w, h);   // geser karakter ke kiri di lanskap (menu di kanan)
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

let yawTarget = 0, dragging = false, lastX = 0, idleT = 0;
canvas.addEventListener('pointerdown', e => { dragging = true; lastX = e.clientX; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', e => {
  if (!dragging) return;
  yawTarget += (e.clientX - lastX) * 0.012; lastX = e.clientX; idleT = 0;
});
['pointerup', 'pointercancel'].forEach(n => canvas.addEventListener(n, () => { dragging = false; }));

/* ---------- loop ---------- */
const clock = new THREE.Clock();
let flickT = 0, nextFlick = 2.5;
function frame_() {
  requestAnimationFrame(frame_);
  const dt = Math.min(clock.getDelta(), 0.1), t = clock.elapsedTime;

  // lampu neon berkedip sesekali
  let f = 1;
  if (!reduceMotion) {
    nextFlick -= dt;
    if (nextFlick < 0) { flickT = 0.3; nextFlick = 3 + rnd() * 7; }
    if (flickT > 0) { flickT -= dt; f = rnd() > 0.5 ? 0.3 : 1; }
  }
  key.intensity = CONFIG.keyLight * f;
  panelMain.color.copy(tint).multiplyScalar(2.6 * (0.25 + 0.75 * f));

  // putar karakter saat digeser, kembali pelan ke depan
  if (!dragging) { idleT += dt; if (idleT > 1.6) yawTarget *= Math.pow(0.02, dt); }
  holder.rotation.y += (yawTarget - holder.rotation.y) * (1 - Math.pow(0.0005, dt));

  if (ready) idle(t);

  // debu
  const p = dustGeo.attributes.position;
  for (let i = 0; i < DUST; i++) {
    const s = dustSeed[i];
    p.array[i * 3] += Math.sin(t * 0.2 + s) * 0.0016 * motion;
    p.array[i * 3 + 1] += (Math.sin(t * 0.3 + s * 1.7) * 0.0012 - 0.0006) * motion;
    p.array[i * 3 + 2] += Math.cos(t * 0.17 + s) * 0.0012 * motion;
    if (p.array[i * 3 + 1] < 0) p.array[i * 3 + 1] = 3;
  }
  p.needsUpdate = true;

  camera.position.set(camBase.x + Math.sin(t * 0.2) * 0.05 * motion, camBase.y + Math.sin(t * 0.27) * 0.012 * motion, camBase.z);
  camera.lookAt(0, lookY, 0);
  composer.render();
}
frame_();
</script>
